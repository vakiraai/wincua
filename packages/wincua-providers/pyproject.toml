[project]
name = "wincua-providers"
version = "0.1.0"
description = "wincua provider bus — Ollama, llama.cpp, OpenAI-compat, OpenAI, Anthropic, Null (HITL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = []

[project.optional-dependencies]
local = []  # stdlib HTTP — no extra deps
cloud = []  # stdlib HTTP — no extra deps
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua_providers"]
