[project]
name = "wincua-hitl"
version = "0.1.0"
description = "wincua local HITL UI + ask_human transport"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = []

[project.optional-dependencies]
serve = []  # fastapi + uvicorn when wired
dev = ["pytest>=8.0"]

[project.scripts]
wincua-hitl = "wincua_hitl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua_hitl"]
