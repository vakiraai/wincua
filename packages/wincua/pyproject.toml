[project]
name = "wincua"
version = "0.1.0"
description = "Windows-host computer-use agent — Agent loop + public façade"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = [
  "wincua-driver",
  "wincua-providers",
  "wincua-hitl",
]

[project.optional-dependencies]
# Declare deps directly as well as via driver extras — some installers resolve
# nested extras inconsistently across interpreters.
# 3.15: comtypes>=1.5.0 + pywin32>=312 (cp315 wheels).
windows = [
    "wincua-driver[windows]",
    "pywinauto>=0.6.9",
    "Pillow>=10.0",
    "comtypes>=1.5.0",
    "pywin32>=312; sys_platform == 'win32'",
]
local = ["wincua-providers", "wincua[windows]"]
cloud = ["wincua-providers"]
mcp = ["wincua-mcp"]
excel = ["wincua-excel"]
slicer = ["wincua-slicer"]
all = ["wincua[local,cloud,mcp,excel,slicer]"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua"]
