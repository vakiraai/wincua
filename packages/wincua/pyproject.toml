[project]
name = "wincua"
version = "0.1.0"
description = "Windows-host computer-use agent — Agent loop + public façade"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = [
  "wincua-driver",
  "wincua-providers",
  "wincua-hitl",
]

[project.optional-dependencies]
windows = ["wincua-driver[windows]"]
local = ["wincua-providers", "wincua[windows]"]
cloud = ["wincua-providers"]
mcp = ["wincua-mcp"]
excel = ["wincua-excel"]
slicer = ["wincua-slicer"]
all = ["wincua[local,cloud,mcp,excel,slicer]"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua"]
