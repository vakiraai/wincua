[project]
name = "wincua-driver"
version = "0.1.0"
description = "wincua observe/act substrate (UIA + screenshot + action router)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = []

[project.optional-dependencies]
# Host Windows UIA via pywinauto (MIT). Not installed on CI/Linux by default.
windows = ["pywinauto>=0.6.8", "Pillow>=10.0"]
# Optional Cua wrap — not required; greenfield UIA path is preferred for MVP.
cua = []
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua_driver"]
