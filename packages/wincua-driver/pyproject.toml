[project]
name = "wincua-driver"
version = "0.1.0"
description = "wincua observe/act substrate (UIA + screenshot + action router)"
readme = "README.md"
# Windows UIA host path: pywinauto/pywin32/comtypes are reliable on 3.11–3.13.
# Cap below 3.15 — import often fails on 3.15 even when pywinauto itself is installed.
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = []

[project.optional-dependencies]
# Host Windows UIA via pywinauto (BSD). Not installed on CI/Linux by default.
# Pin comtypes/pywin32 so nested dep resolution does not pull ancient wheels.
windows = [
    "pywinauto>=0.6.8",
    "Pillow>=10.0",
    "comtypes>=1.4.8",
    "pywin32>=306; platform_system == 'Windows'",
]
# Optional Cua wrap — not required; greenfield UIA path is preferred for MVP.
cua = []
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua_driver"]
