[project]
name = "wincua-mcp"
version = "0.1.0"
description = "wincua MCP server for coding agents (Cursor / Claude / Codex)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = [
  "wincua-driver",
  "wincua-hitl",
  # FastMCP API; mcp 2.x renamed it to MCPServer.
  "mcp>=1.20,<2",
]

[project.optional-dependencies]
windows = ["wincua-driver[windows]"]
dev = ["pytest>=8.0"]

[project.scripts]
wincua-mcp = "wincua_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua_mcp"]
