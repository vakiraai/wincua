[project]
name = "wincua-slicer"
version = "0.1.0"
description = "wincua 3D Slicer helpers — launch, open volume/file, module select (API/CLI)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wincua contributors" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wincua_slicer"]
