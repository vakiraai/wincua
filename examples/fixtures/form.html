<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>wincua form demo</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      max-width: 32rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.45;
    }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.5rem 0.6rem;
      font-size: 1rem;
    }
    button {
      margin-top: 1.25rem;
      padding: 0.55rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.5rem;
      min-height: 1.5rem;
      font-size: 1.1rem;
    }
    #result.ok { color: #0b6e4f; font-weight: 700; }
  </style>
</head>
<body>
  <h1>wincua browser form demo</h1>
  <p>Local fixture for Edge/Chrome UIA + keyboard automation.</p>
  <form id="demo-form" autocomplete="off">
    <label for="name">Full name
      <input id="name" name="name" type="text" aria-label="Full name" />
    </label>
    <label for="email">Email
      <input id="email" name="email" type="email" aria-label="Email" />
    </label>
    <button id="submit" type="submit" aria-label="Submit form">Submit</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
  <script>
    document.getElementById("demo-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var el = document.getElementById("result");
      if (!name || !email) {
        el.className = "";
        el.textContent = "Please fill name and email.";
        return;
      }
      el.className = "ok";
      el.textContent = "OK: " + name + " <" + email + ">";
      document.title = "wincua form demo — submitted";
    });
  </script>
</body>
</html>
