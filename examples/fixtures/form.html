<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>wincua form demo</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      max-width: 32rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.45;
    }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.5rem 0.6rem;
      font-size: 1rem;
    }
    button {
      margin-top: 1.25rem;
      padding: 0.55rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.5rem;
      min-height: 1.5rem;
      font-size: 1.1rem;
    }
    #result.ok { color: #0b6e4f; font-weight: 700; }
  </style>
</head>
<body>
  <!--
    UIA contract (Edge/Chrome): each HTML id is exposed as the AutomationId and
    each <label for> becomes the Edit's Name. Drive it with auto:fullName /
    auto:email / auto:submitButton, or name:Full name / name:Email / name:Submit form.
    On success the result text is shown in #result, appended to the page title
    and the URL fragment becomes #submitted.
  -->
  <h1>wincua browser form demo</h1>
  <p>Local fixture for Edge/Chrome UIA + keyboard automation.</p>
  <form id="demoForm" autocomplete="off">
    <label for="fullName">Full name</label>
    <input id="fullName" name="fullName" type="text" />
    <label for="email">Email</label>
    <input id="email" name="email" type="email" />
    <button id="submitButton" type="submit">Submit form</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
  <script>
    document.getElementById("demoForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var name = document.getElementById("fullName").value.trim();
      var email = document.getElementById("email").value.trim();
      var el = document.getElementById("result");
      if (!name || !email) {
        el.className = "";
        el.textContent = "Please fill name and email.";
        return;
      }
      var text = "OK: " + name + " <" + email + ">";
      el.className = "ok";
      el.textContent = text;
      document.title = "wincua form demo — " + text;
      history.replaceState(null, "", "#submitted");
    });
  </script>
</body>
</html>
